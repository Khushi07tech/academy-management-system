{% extends 'base.html' %}

{% block content %}
<div class="page-header">
    <h1>Archived Teachers</h1>
</div>

<div class="table-section-card">
    <div class="table-header-tools">
        <h2>Deactivated Teachers List</h2>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Teacher Name</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for teacher in teachers %}
                    <tr>
                        <td><strong>{{ teacher['teacher_name'] }}</strong></td>
                        <td>
                            <span class="badge badge-inactive">Deactivated</span>
                        </td>
                        <td>
                            <form action="/admin/teachers/activate/{{ teacher['teacher_id'] }}" method="POST" class="inline-form">
                                <button type="submit" class="btn-outline-success btn-sm">Activate Teacher</button>
                            </form>
                        </td>
                    </tr>
                {% else %}
                    <tr>
                        <td colspan="3" style="text-align: center; color: var(--text-muted);">No deactivated teachers found.</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
